<!doctype html>
<html lang="fr">
  <head>
    <meta charset="utf-8" />
    <title>Meta connecté</title>
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <style>
      body {
        margin: 0;
        font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif;
        background: #0A0A0F;
        color: #fff;
        display: flex;
        align-items: center;
        justify-content: center;
        min-height: 100vh;
        text-align: center;
        padding: 24px;
      }
      .box { max-width: 340px; }
      .spinner {
        width: 32px; height: 32px;
        border: 3px solid rgba(255,255,255,0.15);
        border-top-color: #7C3AED;
        border-radius: 50%;
        margin: 0 auto 16px;
        animation: spin 0.8s linear infinite;
      }
      @keyframes spin { to { transform: rotate(360deg); } }
      a { color: #a78bfa; }
    </style>
  </head>
  <body>
    <div class="box">
      <div class="spinner"></div>
      <div id="msg">Finalisation de la connexion Meta…</div>
      <p style="opacity:.6;font-size:13px;margin-top:16px;">
        Si cette fenêtre ne se ferme pas, <a id="fallback" href="#">cliquez ici</a>.
      </p>
    </div>
    <script>
      (function () {
        try {
          var params = new URLSearchParams(window.location.search);
          var payload = { type: "meta-oauth-result" };
          params.forEach(function (v, k) { payload[k] = v; });

          var fallbackUrl = window.location.origin + "/settings/integrations?" + params.toString();
          var fb = document.getElementById("fallback");
          if (fb) fb.href = fallbackUrl;

          var sent = false;
          try {
            if (window.opener && !window.opener.closed) {
              window.opener.postMessage(payload, window.location.origin);
              sent = true;
            }
          } catch (e) {}

          // Try to close. Browsers only allow window.close() on windows opened by script.
          setTimeout(function () {
            try { window.close(); } catch (e) {}
            // If still open after attempting close, fall back to navigating this popup
            // back to the CRM so the user can keep using it.
            setTimeout(function () {
              if (!window.closed) {
                document.getElementById("msg").textContent = sent
                  ? "Connexion enregistrée. Vous pouvez fermer cette fenêtre."
                  : "Redirection…";
                if (!sent) window.location.replace(fallbackUrl);
              }
            }, 600);
          }, 150);
        } catch (e) {
          document.getElementById("msg").textContent = "Erreur: " + (e && e.message ? e.message : e);
        }
      })();
    </script>
  </body>
</html>
